<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FIGHTER JET DATABASE</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

    :root{
      --bg:#050810;
      --panel:#090d1a;
      --border:#1a2a4a;
      --accent:#00d4ff;
      --accent2:#ff4d00;
      --green:#00ff88;
      --text:#c8d8f0;
      --muted:#4a6080;
      --glow:0 0 20px rgba(0,212,255,0.3);
    }

    body{
      min-height:100vh;
      background:var(--bg);
      color:var(--text);
      font-family:'Rajdhani',sans-serif;
      font-weight:400;
      overflow-x:hidden;
      position:relative;
    }

    /* Grid background */
    body::before{
      content:'';
      position:fixed;
      inset:0;
      background-image:
        linear-gradient(rgba(0,212,255,0.03) 1px,transparent 1px),
        linear-gradient(90deg,rgba(0,212,255,0.03) 1px,transparent 1px);
      background-size:40px 40px;
      pointer-events:none;
      z-index:0;
    }

    /* Radar sweep animation in background */
    .radar-bg{
      position:fixed;
      top:-300px;right:-300px;
      width:700px;height:700px;
      border-radius:50%;
      background:conic-gradient(from 0deg, transparent 0deg, rgba(0,212,255,0.04) 30deg, transparent 60deg);
      animation:sweep 8s linear infinite;
      pointer-events:none;
      z-index:0;
    }
    @keyframes sweep{to{transform:rotate(360deg);}}

    .wrapper{
      position:relative;z-index:1;
      max-width:1000px;
      margin:0 auto;
      padding:2rem 1.5rem 4rem;
    }

    /* Header */
    header{
      text-align:center;
      margin-bottom:2.5rem;
      position:relative;
    }

    .header-line{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:1rem;
      margin-bottom:0.4rem;
    }

    .header-line::before,.header-line::after{
      content:'';
      flex:1;
      height:1px;
      background:linear-gradient(90deg,transparent,var(--accent));
    }
    .header-line::after{background:linear-gradient(90deg,var(--accent),transparent);}

    h1{
      font-family:'Orbitron',monospace;
      font-size:clamp(1.4rem,4vw,2.4rem);
      font-weight:900;
      color:var(--accent);
      text-shadow:var(--glow);
      letter-spacing:0.08em;
      white-space:nowrap;
    }

    .subtitle{
      font-size:0.85rem;
      color:var(--muted);
      letter-spacing:0.3em;
      text-transform:uppercase;
      margin-top:0.3rem;
    }

    /* Search bar */
    .search-wrap{
      position:relative;
      margin-bottom:1.5rem;
    }

    .search-icon{
      position:absolute;
      left:1.2rem;top:50%;
      transform:translateY(-50%);
      font-size:1.1rem;
      color:var(--accent);
      pointer-events:none;
    }

    #searchInput{
      width:100%;
      background:var(--panel);
      border:1px solid var(--border);
      border-radius:4px;
      padding:1rem 1rem 1rem 3rem;
      color:var(--text);
      font-family:'Rajdhani',sans-serif;
      font-size:1.1rem;
      font-weight:600;
      letter-spacing:0.05em;
      outline:none;
      transition:border-color 0.2s,box-shadow 0.2s;
    }
    #searchInput:focus{border-color:var(--accent);box-shadow:var(--glow);}
    #searchInput::placeholder{color:var(--muted);}

    /* Filter pills */
    .filters{
      display:flex;
      flex-wrap:wrap;
      gap:0.5rem;
      margin-bottom:2rem;
    }

    .pill{
      font-family:'Orbitron',monospace;
      font-size:0.62rem;
      font-weight:700;
      letter-spacing:0.1em;
      padding:0.35rem 0.9rem;
      border-radius:2px;
      border:1px solid var(--border);
      background:transparent;
      color:var(--muted);
      cursor:pointer;
      transition:all 0.2s;
      text-transform:uppercase;
    }
    .pill:hover{border-color:var(--accent);color:var(--accent);}
    .pill.active{border-color:var(--accent);color:var(--bg);background:var(--accent);box-shadow:var(--glow);}

    /* Results count */
    .results-bar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:1rem;
      font-size:0.75rem;
      letter-spacing:0.15em;
      text-transform:uppercase;
      color:var(--muted);
    }

    .results-bar span{color:var(--accent);font-family:'Orbitron',monospace;}

    /* Grid */
    .jet-grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(290px,1fr));
      gap:1rem;
    }

    /* Jet card */
    .jet-card{
      background:var(--panel);
      border:1px solid var(--border);
      border-radius:4px;
      padding:1.4rem;
      cursor:pointer;
      transition:border-color 0.2s,box-shadow 0.2s,transform 0.2s;
      position:relative;
      overflow:hidden;
    }

    .jet-card::before{
      content:'';
      position:absolute;
      top:0;left:0;right:0;
      height:2px;
      background:linear-gradient(90deg,transparent,var(--accent),transparent);
      opacity:0;
      transition:opacity 0.2s;
    }

    .jet-card:hover{
      border-color:var(--accent);
      box-shadow:var(--glow);
      transform:translateY(-2px);
    }
    .jet-card:hover::before{opacity:1;}

    .card-top{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      margin-bottom:0.8rem;
    }

    .jet-designation{
      font-family:'Orbitron',monospace;
      font-size:1.2rem;
      font-weight:900;
      color:var(--accent);
      text-shadow:var(--glow);
    }

    .gen-badge{
      font-family:'Orbitron',monospace;
      font-size:0.6rem;
      font-weight:700;
      padding:0.2rem 0.5rem;
      border-radius:2px;
      letter-spacing:0.1em;
    }

    .gen-5{background:rgba(0,212,255,0.15);color:var(--accent);border:1px solid var(--accent);}
    .gen-4{background:rgba(0,255,136,0.1);color:var(--green);border:1px solid var(--green);}
    .gen-3{background:rgba(255,77,0,0.1);color:var(--accent2);border:1px solid var(--accent2);}
    .gen-6{background:rgba(180,0,255,0.15);color:#c060ff;border:1px solid #c060ff;}

    .jet-name{
      font-size:1rem;
      font-weight:600;
      color:var(--text);
      margin-bottom:0.3rem;
    }

    .jet-country{
      font-size:0.78rem;
      color:var(--muted);
      letter-spacing:0.1em;
      text-transform:uppercase;
      margin-bottom:1rem;
    }

    .stats-row{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:0.5rem;
      margin-bottom:1rem;
    }

    .stat{
      background:rgba(0,212,255,0.04);
      border:1px solid rgba(0,212,255,0.08);
      border-radius:3px;
      padding:0.4rem 0.6rem;
    }

    .stat-label{
      font-size:0.6rem;
      color:var(--muted);
      letter-spacing:0.15em;
      text-transform:uppercase;
      margin-bottom:0.15rem;
    }

    .stat-value{
      font-family:'Orbitron',monospace;
      font-size:0.82rem;
      font-weight:700;
      color:var(--text);
    }

    .price-row{
      display:flex;
      justify-content:space-between;
      align-items:center;
      border-top:1px solid var(--border);
      padding-top:0.8rem;
      margin-top:0.2rem;
    }

    .price-label{
      font-size:0.65rem;
      color:var(--muted);
      letter-spacing:0.15em;
      text-transform:uppercase;
    }

    .price-value{
      font-family:'Orbitron',monospace;
      font-size:1rem;
      font-weight:900;
      color:var(--green);
      text-shadow:0 0 12px rgba(0,255,136,0.4);
    }

    .role-tag{
      font-size:0.65rem;
      font-weight:600;
      letter-spacing:0.1em;
      text-transform:uppercase;
      color:var(--muted);
      margin-bottom:0.8rem;
    }

    /* No results */
    .no-results{
      text-align:center;
      padding:4rem 2rem;
      color:var(--muted);
      grid-column:1/-1;
    }

    .no-results .code{
      font-family:'Orbitron',monospace;
      font-size:3rem;
      color:var(--border);
      margin-bottom:1rem;
    }

    /* Modal overlay */
    .modal-overlay{
      position:fixed;inset:0;
      background:rgba(0,0,0,0.85);
      z-index:100;
      display:flex;align-items:center;justify-content:center;
      padding:1rem;
      opacity:0;pointer-events:none;
      transition:opacity 0.2s;
    }
    .modal-overlay.open{opacity:1;pointer-events:all;}

    .modal{
      background:var(--panel);
      border:1px solid var(--accent);
      box-shadow:0 0 60px rgba(0,212,255,0.2);
      border-radius:6px;
      max-width:620px;width:100%;
      max-height:90vh;overflow-y:auto;
      padding:2rem;
      position:relative;
      transform:translateY(20px);
      transition:transform 0.2s;
    }
    .modal-overlay.open .modal{transform:translateY(0);}

    .modal-close{
      position:absolute;top:1rem;right:1rem;
      background:none;border:1px solid var(--border);
      color:var(--muted);font-size:1rem;
      width:32px;height:32px;border-radius:3px;
      cursor:pointer;display:flex;align-items:center;justify-content:center;
      transition:all 0.2s;font-family:'Orbitron',monospace;
    }
    .modal-close:hover{border-color:var(--accent2);color:var(--accent2);}

    .modal-designation{
      font-family:'Orbitron',monospace;
      font-size:2rem;font-weight:900;
      color:var(--accent);text-shadow:var(--glow);
      margin-bottom:0.2rem;
    }

    .modal-name{font-size:1.2rem;font-weight:600;margin-bottom:0.2rem;}
    .modal-country{font-size:0.8rem;color:var(--muted);letter-spacing:0.15em;text-transform:uppercase;margin-bottom:1.5rem;}

    .modal-section{margin-bottom:1.5rem;}

    .modal-section-title{
      font-family:'Orbitron',monospace;
      font-size:0.65rem;font-weight:700;
      letter-spacing:0.2em;text-transform:uppercase;
      color:var(--accent);
      margin-bottom:0.75rem;
      padding-bottom:0.4rem;
      border-bottom:1px solid var(--border);
    }

    .modal-stats{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
      gap:0.6rem;
    }

    .modal-stat{
      background:rgba(0,212,255,0.04);
      border:1px solid rgba(0,212,255,0.08);
      border-radius:3px;padding:0.6rem 0.8rem;
    }

    .modal-stat-label{font-size:0.6rem;color:var(--muted);letter-spacing:0.15em;text-transform:uppercase;margin-bottom:0.2rem;}
    .modal-stat-value{font-family:'Orbitron',monospace;font-size:0.88rem;font-weight:700;color:var(--text);}

    .modal-desc{font-size:0.9rem;line-height:1.7;color:var(--text);font-weight:300;}

    .modal-price-box{
      background:rgba(0,255,136,0.05);
      border:1px solid rgba(0,255,136,0.2);
      border-radius:4px;
      padding:1rem 1.2rem;
      display:flex;justify-content:space-between;align-items:center;
    }

    .modal-price-label{font-size:0.7rem;color:var(--muted);letter-spacing:0.15em;text-transform:uppercase;}
    .modal-price-value{font-family:'Orbitron',monospace;font-size:1.4rem;font-weight:900;color:var(--green);text-shadow:0 0 16px rgba(0,255,136,0.4);}
    .modal-price-note{font-size:0.65rem;color:var(--muted);margin-top:0.2rem;}
  </style>
</head>

<div class="radar-bg"></div>

  <div class="results-bar">

  </div>

  <div class="jet-grid" id="jetGrid"></div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">

</div>

let activeFilter = 'all';
let searchTerm = '';

function getGenClass(gen){
  if(gen==='Gen 5') return 'gen-5';
  if(gen==='Gen 4') return 'gen-4';
  if(gen==='Gen 6') return 'gen-6';
  return 'gen-3';
}

function filterJets(){
  return jets.filter(j=>{
    const s = searchTerm.toLowerCase();
    const matchSearch = !s ||
      j.designation.toLowerCase().includes(s) ||
      j.name.toLowerCase().includes(s) ||
      j.country.toLowerCase().includes(s) ||
      j.role.toLowerCase().includes(s) ||
      j.manufacturer.toLowerCase().includes(s);

    const matchFilter = activeFilter==='all' ||
      j.region===activeFilter ||
      j.gen===activeFilter;

    return matchSearch && matchFilter;
  });
}

function renderCards(){
  const filtered = filterJets();
  const grid = document.getElementById('jetGrid');
  document.getElementById('resultCount').textContent = filtered.length;

  if(!filtered.length){
    grid.innerHTML = `<div class="no-results"><div class="code">404</div><div>NO AIRCRAFT FOUND</div></div>`;
    return;
  }

  grid.innerHTML = filtered.map((j,i)=>`
    <div class="jet-card" onclick="openModal(${jets.indexOf(j)})">
      <div class="card-top">
        <div class="jet-designation">${j.designation.split(' ')[0]}</div>
        <div class="gen-badge ${getGenClass(j.gen)}">${j.gen}</div>
      </div>
      <div class="jet-name">${j.designation}</div>
      <div class="jet-country">🌐 ${j.country}</div>
      <div class="role-tag">▸ ${j.role}</div>
      <div class="stats-row">
        <div class="stat"><div class="stat-label">Top Speed</div><div class="stat-value">${j.specs.speed}</div></div>
        <div class="stat"><div class="stat-label">Range</div><div class="stat-value">${j.specs.range}</div></div>
      </div>
      <div class="price-row">
        <div><div class="price-label">Est. Unit Cost</div></div>
        <div class="price-value">${j.price}</div>
      </div>
    </div>
  `).join('');
}

function openModal(idx){
  const j = jets[idx];
  document.getElementById('modalContent').innerHTML = `
    <div class="modal-designation">${j.designation}</div>
    <div class="modal-name">${j.name} · ${j.role}</div>
    <div class="modal-country">🌐 ${j.country} · ${j.manufacturer} · Introduced ${j.introduced}</div>

    <div class="modal-section">
      <div class="modal-section-title">Performance Specs</div>
      <div class="modal-stats">
        ${Object.entries(j.specs).map(([k,v])=>`
          <div class="modal-stat">
            <div class="modal-stat-label">${k}</div>
            <div class="modal-stat-value">${v}</div>
          </div>
        `).join('')}
        <div class="modal-stat">
          <div class="modal-stat-label">Generation</div>
          <div class="modal-stat-value">${j.gen}</div>
        </div>
        <div class="modal-stat">
          <div class="modal-stat-label">In Service</div>
          <div class="modal-stat-value">${j.inService > 0 ? j.inService+'+' : 'Retired'}</div>
        </div>
      </div>
    </div>

    <div class="modal-section">
      <div class="modal-section-title">Overview</div>
      <div class="modal-desc">${j.desc}</div>
    </div>

    <div class="modal-price-box">
      <div>
        <div class="modal-price-label">Estimated Unit Cost</div>
        <div class="modal-price-note">${j.priceNote}</div>
      </div>
      <div class="modal-price-value">${j.price}</div>
    </div>
  `;
  document.getElementById('modalOverlay').classList.add('open');
  document.body.style.overflow='hidden';
}

function closeModal(e){
  if(e.target===document.getElementById('modalOverlay')) closeModalBtn();
}

function closeModalBtn(){
  document.getElementById('modalOverlay').classList.remove('open');
  document.body.style.overflow='';
}

document.getElementById('searchInput').addEventListener('input',e=>{
  searchTerm=e.target.value;
  renderCards();
});

document.querySelectorAll('.pill').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.pill').forEach(p=>p.classList.remove('active'));
    btn.classList.add('active');
    activeFilter=btn.dataset.filter;
    renderCards();
  });
});

document.addEventListener('keydown',e=>{
  if(e.key==='Escape') closeModalBtn();
});

renderCards();
</script>
</body>
</html>
